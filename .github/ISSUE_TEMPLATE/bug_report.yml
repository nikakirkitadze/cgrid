name: Bug report
description: Something in cgrid doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cgrid doctor`
      render: text
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal app
      placeholder: Terminal.app, iTerm2, Ghostty, WezTerm, GNOME Terminal…

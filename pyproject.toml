[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cgrid"
dynamic = ["version"]
description = "Open a grid of Claude Code sessions in one terminal window, with folder suggestions learned from your history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Nika Kirkitadze" }]
keywords = ["claude", "claude-code", "tmux", "terminal", "cli", "ai", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nikakirkitadze/cgrid"
Issues = "https://github.com/nikakirkitadze/cgrid/issues"
Changelog = "https://github.com/nikakirkitadze/cgrid/blob/main/CHANGELOG.md"

[project.scripts]
cgrid = "cgrid:main"

[tool.setuptools]
py-modules = ["cgrid"]

[tool.setuptools.dynamic]
version = { attr = "cgrid.__version__" }

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
